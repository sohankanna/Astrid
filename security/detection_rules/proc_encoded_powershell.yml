title: Encoded PowerShell Command Execution
id: 8f2b41c0-1111-4a00-9000-50c0ffee0003
status: experimental
description: >
  Detects PowerShell invoked with a base64-encoded command. PowerShell accepts
  any unambiguous prefix of -EncodedCommand, so -e, -en and -enc must all be
  covered. The encoded payload is never decoded by the detection pipeline and
  never executed -- only its presence and length are recorded as evidence.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/010/
author: Hackathon SOC team (synthetic)
date: 2026/09/18
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|re: '(?i)\s-(e|en|enc|encodedcommand)\s+[A-Za-z0-9+/=]{16,}'
  condition: selection_image and selection_encoded
fields:
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Some management and deployment tooling legitimately passes encoded commands
  - Packaged installers that wrap PowerShell payloads
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027.010
internal_rule_id: SOC-EXEC-002
