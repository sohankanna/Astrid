title: Password Spraying From a Single Source Address
id: 8f2b41c0-1111-4a00-9000-50c0ffee0001
status: experimental
description: >
  Detects multiple distinct accounts failing authentication from one source
  address within a short window. Distinct accounts -- not attempt count -- is
  the discriminator: many attempts against one account is brute force, few
  attempts against many accounts is spraying.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Hackathon SOC team (synthetic)
date: 2026/09/18
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  timeframe: 5m
  condition: selection | count(distinct TargetUserName) by IpAddress >= 3
falsepositives:
  - Shared NAT or VPN egress addresses where several users mistype passwords
  - Misconfigured service accounts with stale credentials after a password change
  - Vulnerability scanners performing authenticated checks
level: high
tags:
  - attack.credential_access
  - attack.t1110.003
internal_rule_id: SOC-AUTH-001
